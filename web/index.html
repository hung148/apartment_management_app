<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="phan_mem_quan_ly_can_ho">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>phan_mem_quan_ly_can_ho</title>
  <link rel="manifest" href="manifest.json">

  <!-- Speed (2026-10-09): open the connections and start the big downloads
       while the page is still starting, instead of one after the other. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.google.com">
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com">
  <link rel="preconnect" href="https://securetoken.googleapis.com">
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <script>
    // Preload the one app file this browser will run (2026-10-10, W3): the
    // WebAssembly build on Chrome/Edge (same test as Flutter's loader in
    // flutter_bootstrap.js: Chromium engine, WasmGC, WebGL), the JavaScript
    // build everywhere else (iPhone, Safari, Firefox). Preloading both made
    // Chrome download 2 MB it never used.
    (function () {
      var blink = navigator.vendor === 'Google Inc.' || navigator.userAgent.indexOf('Edg/') >= 0;
      var gc = false, gl = false;
      try {
        gc = WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]));
        var c = document.createElement('canvas');
        gl = !!(c.getContext('webgl2') || c.getContext('webgl'));
      } catch (e) {}
      function preload(href, as) {
        var l = document.createElement('link');
        l.rel = as === 'module' ? 'modulepreload' : 'preload';
        l.href = href;
        if (as !== 'module') l.as = as;
        if (as === 'fetch') l.crossOrigin = 'anonymous';
        document.head.appendChild(l);
      }
      if (blink && gc && gl) {
        preload('main.dart.mjs', 'module');
        preload('main.dart.wasm', 'fetch');
      } else {
        preload('main.dart.js', 'script');
      }
    })();
  </script>
  <link rel="preload" href="assets/FontManifest.json" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="assets/assets/fonts/Roboto-Regular.ttf" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="assets/assets/fonts/Roboto-Bold.ttf" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="fetch" crossorigin="anonymous">

  <!-- Shown from the first moment until the app draws (removed by the app). -->
  <style>
    html, body { margin: 0; height: 100%; background: #0e1116; }
    #start-screen {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0e1116; color: #e8ecf2;
      font-family: Roboto, "Segoe UI", Arial, sans-serif;
    }
    #start-screen img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 32px rgba(0,0,0,.45); }
    #start-screen .name { margin-top: 20px; font-size: 26px; font-weight: 700; letter-spacing: .5px; }
    #start-screen .name b { color: #4a9eff; }
    #start-screen .bar { margin-top: 28px; width: 140px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(255,255,255,.15); }
    #start-screen .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: #4a9eff; animation: start-move 1.1s ease-in-out infinite; }
    @keyframes start-move { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #start-screen .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="start-screen" role="status" aria-label="Loading">
    <img src="icons/splash_icon.jpg" alt="">
    <div class="name"><b>C</b>anHo360</div>
    <div class="bar"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
